site_name: Energy Anomaly Forecasting
site_description: Open-source energy anomaly detection and time-series forecasting
repo_url: https://github.com/mj-weshh/energy-anomaly-forecasting
repo_name: energy-anomaly-forecasting

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - toc.integrate

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - E2E Pipeline: e2e-pipeline.md
  - Understanding the data:
      - Data Schema: data-schema.md
      - Verification Report: verification-report.md
      - EDA Insights: eda-insights.md
      - Feature Engineering: feature-engineering.md
  - Anomaly detection:
      - Anomaly Detection: anomaly-detection.md
      - Clean Dataset: clean-data.md
      - Anomaly Tuning Results: anomaly-tuning-results.md
  - Forecasting:
      - Forecast Model Comparison: forecast-model-comparison.md
      - Forecasting Research: forecasting-research.md
      - Forecasting Tutorial: forecasting-tutorial.md
      - Forecasting Baseline: forecasting-baseline.md
      - Prophet Baseline: prophet-baseline.md
      - XGBoost Prep: xgboost-prep.md
      - XGBoost Forecasting: xgboost-forecasting.md
      - LSTM Prep: lstm-prep.md
      - LSTM Forecasting: lstm-forecasting.md
  - Reference:
      - Glossary: glossary.md
      - Phase 2 Strategy: phase2-strategy.md
      - Phase 3 Strategy: phase3-strategy.md

docs_dir: docs

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
  - tables
  - fenced_code
  - toc:
      permalink: true
